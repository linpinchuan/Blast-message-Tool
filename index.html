<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>群发助手</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@600&display=swap">
<style>
/* Layout: one column workbench, three sequential panels (template, recipients, send). Template panel splits editor / live preview. */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --fg: #181b24;
  --muted: #5a6171;
  --line: #dde0e8;
  --accent: #2f4bd8;
  --accent-fg: #ffffff;
  --accent-soft: #e8ecfd;
  --ok: #1b7a49;
  --ok-soft: #e2f3e9;
  --bubble: #e2f3e9;
  --warn: #9a5b00;
  --warn-soft: #fdf1da;
  --bad: #b3261e;
  --font-body: "Inter", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Space Grotesk", "Noto Sans SC", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b24; --fg: #e8eaf0; --muted: #98a0b0; --line: #2a303c;
    --accent: #8498ff; --accent-fg: #0f1218; --accent-soft: #1f2640;
    --ok: #5fd394; --ok-soft: #17301f; --bubble: #17301f;
    --warn: #f0b95a; --warn-soft: #33270e; --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b24; --fg: #e8eaf0; --muted: #98a0b0; --line: #2a303c;
  --accent: #8498ff; --accent-fg: #0f1218; --accent-soft: #1f2640;
  --ok: #5fd394; --ok-soft: #17301f; --bubble: #17301f;
  --warn: #f0b95a; --warn-soft: #33270e; --bad: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.top > div:first-child { min-width: 0; flex: 1 1 320px; }
h1 { font-family: var(--font-display); font-size: 1.75rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 60ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
h2 { font-size: 1.05rem; margin: 0; display: flex; align-items: center; gap: 10px; }
.stepno { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: inline-grid; place-items: center; font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 780px) { .two { grid-template-columns: minmax(0, 1fr); } }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 0.8rem; font-weight: 500; color: var(--muted); min-width: 0; }
.hint { font-weight: 400; font-size: 0.78rem; color: var(--muted); margin: 0; }
input[type="text"], select, textarea {
  font: inherit; font-size: 0.95rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 150px; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, .btn {
  font: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer; text-decoration: none;
  border-radius: 6px; padding: 7px 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
button:hover, .btn:hover { border-color: var(--accent); }
.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.primary:hover { filter: brightness(1.08); }
.ghost { border-color: transparent; color: var(--muted); background: transparent; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 7px 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); min-width: 0; }
.card h3 { margin: 0; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 button { text-transform: none; letter-spacing: 0; padding: 3px 9px; font-size: 0.78rem; }
.bubble { background: var(--bubble); border-radius: 10px 10px 10px 2px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.92rem; }
.mail-sub { font-weight: 600; overflow-wrap: anywhere; }
.mail-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.92rem; color: var(--fg); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 12px; font-size: 0.85rem; }
.msg { font-size: 0.85rem; color: var(--ok); min-height: 1.3em; margin: 0; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.name { font-weight: 600; }
td.name small { display: block; font-weight: 400; color: var(--muted); }
.chan { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.chan .num { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chan label { display: inline-flex; gap: 6px; align-items: center; font-size: 0.8rem; color: var(--muted); }
.chan.done .btn { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.bad { color: var(--bad); font-size: 0.82rem; }
td select { padding: 5px 8px; width: auto; }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.88rem; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; max-width: 78ch; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { button, .btn { transition: border-color 0.15s, filter 0.15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="seg" id="uiLang" role="group" aria-label="Language">
      <button type="button" data-l="zh">中文</button>
      <button type="button" data-l="en">EN</button>
    </div>
  </header>

  <section class="panel" aria-labelledby="h-tpl">
    <h2 id="h-tpl"><span class="stepno">1</span><span data-i18n="s1"></span></h2>
    <div class="two">
      <div class="col">
        <div class="seg" id="tplTab" role="group" aria-label="Template language">
          <button type="button" data-l="zh" data-i18n="tabZh"></button>
          <button type="button" data-l="en" data-i18n="tabEn"></button>
        </div>
        <label class="f"><span data-i18n="subject"></span>
          <input type="text" id="tplSubject" autocomplete="off">
        </label>
        <label class="f"><span data-i18n="body"></span>
          <textarea id="tplBody"></textarea>
        </label>
        <div class="row">
          <span class="hint" data-i18n="insert"></span>
          <button type="button" id="insName">{name}</button>
          <button type="button" id="insSender">{sender}</button>
        </div>
        <label class="f"><span data-i18n="sender"></span>
          <input type="text" id="sender" autocomplete="off">
        </label>
      </div>
      <div class="col">
        <label class="f"><span data-i18n="previewFor"></span>
          <select id="previewWho"></select>
        </label>
        <div class="card">
          <h3><span>WhatsApp</span><button type="button" id="copyWa" data-i18n="copy"></button></h3>
          <div class="bubble" id="pvWa"></div>
        </div>
        <div class="card">
          <h3><span data-i18n="emCard"></span><button type="button" id="copyEm" data-i18n="copy"></button></h3>
          <div class="mail-sub" id="pvSub"></div>
          <div class="mail-body" id="pvBody"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-rcp">
    <h2 id="h-rcp"><span class="stepno">2</span><span data-i18n="s2"></span></h2>
    <div class="fields">
      <label class="f"><span data-i18n="cc"></span>
        <input type="text" id="cc" inputmode="numeric" autocomplete="off">
        <span class="hint" data-i18n="ccHint"></span>
      </label>
      <label class="f"><span data-i18n="defLang"></span>
        <select id="defLang">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
    <label class="f"><span data-i18n="pasteLabel"></span>
      <textarea id="paste" data-i18n-ph="pastePh" style="min-height:110px"></textarea>
      <span class="hint" data-i18n="pasteHint"></span>
    </label>
    <div class="row">
      <button type="button" class="primary" id="addBtn" data-i18n="add"></button>
      <button type="button" id="uploadBtn" data-i18n="upload"></button>
      <input type="file" id="file" accept=".csv,.txt,text/csv,text/plain" hidden>
      <button type="button" class="ghost" id="clearBtn" data-i18n="clear"></button>
    </div>
    <p class="msg" id="addMsg" role="status"></p>
  </section>

  <section class="panel" aria-labelledby="h-send">
    <h2 id="h-send"><span class="stepno">3</span><span data-i18n="s3"></span></h2>
    <div class="fields">
      <label class="f"><span data-i18n="provider"></span>
        <select id="provider">
          <option value="gmail" data-i18n="gmail"></option>
          <option value="outlook" data-i18n="outlook"></option>
          <option value="mailto" data-i18n="mailto"></option>
        </select>
        <span class="hint" data-i18n="providerHint"></span>
      </label>
    </div>
    <div id="exBanner" class="banner" hidden data-i18n="exBanner"></div>
    <div class="row" style="justify-content:space-between">
      <span class="progress" id="progress"></span>
      <button type="button" class="ghost" id="resetBtn" data-i18n="resetStatus"></button>
    </div>
    <div id="listArea"></div>
  </section>

  <p class="note" data-i18n="note"></p>
  <p class="note" data-i18n="storage"></p>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  var STORE = 'blastdesk-v1';

  var I18N = {
    zh: {
      title: '群发助手',
      sub: '写好中英文模板，导入名单，逐个打开 WhatsApp 和邮件，确认后发送。',
      s1: '消息模板', s2: '收件人', s3: '发送',
      tabZh: '中文模板', tabEn: 'English 模板',
      subject: '邮件标题', body: '正文（WhatsApp 和邮件共用）',
      insert: '插入变量', sender: '署名（替换 {sender}）',
      previewFor: '预览姓名', emCard: '邮件', copy: '复制', copied: '已复制',
      cc: '默认国家区号', ccHint: '号码没写区号时自动加上，马来西亚是 60。',
      defLang: '名单没写语言时使用',
      pasteLabel: '粘贴名单，每行一位',
      pasteHint: '可含姓名、手机号、邮箱、语言（中 / EN），顺序不限，用逗号或 Tab 分隔，可直接从 Excel 复制。',
      pastePh: '陈小明, 012-345 6789, xiaoming@example.com, 中\nSarah Lim, +60 17-888 2200, sarah@example.com, EN',
      add: '加入名单', upload: '导入 CSV', clear: '清空名单',
      added: function (n, s) { return '已加入 ' + n + ' 位' + (s ? '，跳过 ' + s + ' 行（没有号码也没有邮箱）' : '') + '。'; },
      exBanner: '以下是示例数据。加入你自己的名单时会自动清除。',
      colName: '姓名', colLang: '语言', colWa: 'WhatsApp', colEm: '邮件',
      openWa: '打开 WhatsApp', openEm: '写邮件', done: '已处理',
      noPhone: '没有号码', badPhone: '号码无效', noEmail: '没有邮箱',
      provider: '邮件打开方式', gmail: 'Gmail 网页版', outlook: 'Outlook 网页版', mailto: '默认邮件程序（mailto）',
      providerHint: 'mailto 在部分环境打不开，建议用网页版。',
      progress: function (w, e, n) { return 'WhatsApp ' + w + '/' + n + ' · 邮件 ' + e + '/' + n; },
      resetStatus: '重置处理状态',
      empty: '名单是空的。先在上面粘贴或导入。',
      remove: '移除',
      note: '这个页面不会自动发送。每个按钮会在 WhatsApp 或邮箱里打开已填好的消息，由你确认后按发送，发送速度也由你控制。要全自动群发，需要 WhatsApp Business API 和邮件服务，可以另外做成带后端的版本。请只发给同意接收的人。',
      storage: '名单和模板只保存在这台设备的浏览器里。',
      sampleName: '小明'
    },
    en: {
      title: 'Blast Desk',
      sub: 'Write Chinese and English templates, import a list, then open each WhatsApp chat or email and send.',
      s1: 'Message template', s2: 'Recipients', s3: 'Send',
      tabZh: '中文 template', tabEn: 'English template',
      subject: 'Email subject', body: 'Message (shared by WhatsApp and email)',
      insert: 'Insert', sender: 'Sign-off (replaces {sender})',
      previewFor: 'Preview name', emCard: 'Email', copy: 'Copy', copied: 'Copied',
      cc: 'Default country code', ccHint: 'Added when a number has no code. Malaysia is 60.',
      defLang: 'Language when the list has none',
      pasteLabel: 'Paste your list, one person per line',
      pasteHint: 'Name, mobile number, email and language (中 / EN) in any order, separated by commas or tabs. Copying from Excel works.',
      pastePh: 'Sarah Lim, +60 17-888 2200, sarah@example.com, EN\n陈小明, 012-345 6789, xiaoming@example.com, 中',
      add: 'Add to list', upload: 'Import CSV', clear: 'Clear list',
      added: function (n, s) { return 'Added ' + n + (n === 1 ? ' person' : ' people') + (s ? ', skipped ' + s + ' line' + (s === 1 ? '' : 's') + ' with no number or email' : '') + '.'; },
      exBanner: 'This is sample data. It is removed when you add your own list.',
      colName: 'Name', colLang: 'Language', colWa: 'WhatsApp', colEm: 'Email',
      openWa: 'Open WhatsApp', openEm: 'Write email', done: 'Handled',
      noPhone: 'No number', badPhone: 'Invalid number', noEmail: 'No email',
      provider: 'Open email with', gmail: 'Gmail on the web', outlook: 'Outlook on the web', mailto: 'Default mail app (mailto)',
      providerHint: 'mailto does not open in some environments. The web options are safer.',
      progress: function (w, e, n) { return 'WhatsApp ' + w + '/' + n + ' · Email ' + e + '/' + n; },
      resetStatus: 'Reset handled marks',
      empty: 'The list is empty. Paste or import names above.',
      remove: 'Remove',
      note: 'This page does not send anything by itself. Each button opens a ready-made message in WhatsApp or your mailbox, and you press send, so you set the pace. Fully automatic blasting needs the WhatsApp Business API and an email service, which would be a separate version with a backend. Only message people who agreed to hear from you.',
      storage: 'Your list and templates stay in this device\'s browser.',
      sampleName: 'Sam'
    }
  };

  var DEFAULT_TPL = {
    zh: {
      subject: '{name}，年终聚会邀请',
      body: '你好 {name}，\n\n诚挚邀请你参加 12 月 12 日（周六）下午 3 点在吉隆坡举行的年终聚会。请在 12 月 5 日前回复是否出席。\n\n谢谢！\n{sender}'
    },
    en: {
      subject: 'Year-end gathering invitation, {name}',
      body: 'Hi {name},\n\nYou are invited to our year-end gathering on Saturday, 12 December at 3 pm in Kuala Lumpur. Please let us know by 5 December whether you can come.\n\nThank you,\n{sender}'
    }
  };

  function examples() {
    return [
      { name: '陈小明', phone: '012-345 6789', email: 'xiaoming@example.com', lang: 'zh' },
      { name: 'Sarah Lim', phone: '+60 17-888 2200', email: 'sarah@example.com', lang: 'en' },
      { name: 'Ahmad Faris', phone: '019-333 4455', email: 'ahmad@example.com', lang: 'en' },
      { name: '林美玲', phone: '011-2345 6789', email: 'meiling@example.com', lang: 'zh' }
    ].map(function (c) { return mk(c, true); });
  }

  var uid = 0;
  function mk(c, ex) {
    uid += 1;
    return { id: 'c' + Date.now().toString(36) + uid, name: c.name || '', phone: c.phone || '', email: c.email || '', lang: c.lang || 'zh', waDone: false, emDone: false, example: !!ex };
  }

  var state = {
    ui: 'zh', tplTab: 'zh', cc: '60', defLang: 'zh', provider: 'gmail', sender: '',
    tpl: JSON.parse(JSON.stringify(DEFAULT_TPL)), contacts: null, who: ''
  };

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (raw) {
        var s = JSON.parse(raw);
        Object.keys(state).forEach(function (k) { if (s[k] !== undefined && s[k] !== null) state[k] = s[k]; });
        if (!state.tpl.zh || !state.tpl.en) state.tpl = JSON.parse(JSON.stringify(DEFAULT_TPL));
      }
    } catch (e) {}
    if (!Array.isArray(state.contacts)) state.contacts = examples();
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  function t(k) {
    var v = I18N[state.ui][k];
    if (typeof v === 'function') return v.apply(null, Array.prototype.slice.call(arguments, 1));
    return v;
  }
  function $(id) { return document.getElementById(id); }
  function el(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) if (kids[j] != null) e.append(kids[j]);
    }
    return e;
  }
  function debounce(fn, ms) { var h; return function () { clearTimeout(h); h = setTimeout(fn, ms); }; }

  /* ---------- message building ---------- */
  function fill(str, name) {
    return String(str || '').replace(/\{(name|sender)\}/g, function (_, k) {
      return k === 'name' ? name : (state.sender || '');
    });
  }
  function msgFor(lang, name) {
    var tp = state.tpl[lang] || state.tpl.zh;
    return { subject: fill(tp.subject, name), body: fill(tp.body, name) };
  }
  function normPhone(raw) {
    if (!raw) return '';
    var s = String(raw).trim();
    var plus = s.charAt(0) === '+';
    var d = s.replace(/\D/g, '');
    if (!d) return '';
    var cc = String(state.cc || '').replace(/\D/g, '');
    if (!plus) {
      if (d.indexOf('00') === 0) d = d.slice(2);
      else if (d.charAt(0) === '0') d = cc + d.slice(1);
      else if (cc && d.indexOf(cc) !== 0) d = cc + d;
    }
    return d.length >= 8 && d.length <= 15 ? d : '';
  }
  function waLink(c) {
    var n = normPhone(c.phone);
    if (!n) return '';
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent(msgFor(c.lang, c.name).body);
  }
  function mailLink(c) {
    if (!c.email) return '';
    var m = msgFor(c.lang, c.name);
    var to = encodeURIComponent(c.email), su = encodeURIComponent(m.subject), bo = encodeURIComponent(m.body);
    if (state.provider === 'outlook') return 'https://outlook.live.com/mail/0/deeplink/compose?to=' + to + '&subject=' + su + '&body=' + bo;
    if (state.provider === 'mailto') return 'mailto:' + c.email + '?subject=' + su + '&body=' + bo;
    return 'https://mail.google.com/mail/?view=cm&fs=1&to=' + to + '&su=' + su + '&body=' + bo;
  }

  /* ---------- parsing ---------- */
  var ZH = /^(zh|cn|chi|chinese|中|中文|华|华语|华文)$/i;
  var EN = /^(en|eng|english|英|英文|英语)$/i;
  function classify(f, rec) {
    f = f.trim();
    if (!f) return;
    if (f.indexOf('@') > 0) { if (!rec.email) rec.email = f; return; }
    if (ZH.test(f)) { rec.lang = 'zh'; return; }
    if (EN.test(f)) { rec.lang = 'en'; return; }
    var digits = f.replace(/\D/g, '');
    if (/^[+\d][\d\s\-().]*$/.test(f) && digits.length >= 7) { if (!rec.phone) rec.phone = f; return; }
    rec.name = rec.name ? rec.name + ' ' + f : f;
  }
  function parseText(text) {
    var out = [], skipped = 0;
    text.replace(/^﻿/, '').split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var rec = { name: '', phone: '', email: '', lang: state.defLang };
      var parts;
      if (line.indexOf('\t') >= 0) parts = line.split('\t');
      else if (/[,;，；]/.test(line)) parts = line.split(/[,;，；]/);
      else parts = line.trim().split(/\s+/);
      parts.forEach(function (p) { classify(p.replace(/^"|"$/g, ''), rec); });
      if (!rec.phone && !rec.email) { skipped += 1; return; }
      out.push(rec);
    });
    return { rows: out, skipped: skipped };
  }
  function addFromText(text) {
    var r = parseText(text);
    if (r.rows.length) {
      state.contacts = state.contacts.filter(function (c) { return !c.example; });
      r.rows.forEach(function (x) { state.contacts.push(mk(x, false)); });
    }
    $('addMsg').textContent = t('added', r.rows.length, r.skipped);
    save();
    renderAll();
  }

  /* ---------- rendering ---------- */
  function applyI18n() {
    document.documentElement.lang = state.ui === 'zh' ? 'zh' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (n) { n.placeholder = t(n.getAttribute('data-i18n-ph')); });
    $('uiLang').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.l === state.ui)); });
  }
  function renderTplFields() {
    $('tplTab').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.l === state.tplTab)); });
    $('tplSubject').value = state.tpl[state.tplTab].subject;
    $('tplBody').value = state.tpl[state.tplTab].body;
    $('sender').value = state.sender;
    $('cc').value = state.cc;
    $('defLang').value = state.defLang;
    $('provider').value = state.provider;
  }
  function renderWho() {
    var sel = $('previewWho');
    var cur = state.who;
    sel.textContent = '';
    sel.append(el('option', { value: '', text: t('sampleName') }));
    state.contacts.forEach(function (c) {
      sel.append(el('option', { value: c.id, text: c.name || c.email || c.phone }));
    });
    sel.value = state.contacts.some(function (c) { return c.id === cur; }) ? cur : '';
    state.who = sel.value;
  }
  function previewName() {
    var c = state.contacts.filter(function (x) { return x.id === state.who; })[0];
    return c && c.name ? c.name : t('sampleName');
  }
  function renderPreview() {
    var m = msgFor(state.tplTab, previewName());
    $('pvWa').textContent = m.body;
    $('pvSub').textContent = m.subject;
    $('pvBody').textContent = m.body;
  }
  function renderProgress() {
    var n = state.contacts.length;
    var w = state.contacts.filter(function (c) { return c.waDone; }).length;
    var e = state.contacts.filter(function (c) { return c.emDone; }).length;
    $('progress').textContent = n ? t('progress', w, e, n) : '';
    $('exBanner').hidden = !state.contacts.some(function (c) { return c.example; });
  }
  function chanCell(c, ch) {
    var done = ch === 'wa' ? c.waDone : c.emDone;
    var wrap = el('div', { class: 'chan' + (done ? ' done' : '') });
    var href, num = '';
    if (ch === 'wa') {
      var n = normPhone(c.phone);
      href = waLink(c);
      if (n) num = '+' + n;
      if (!c.phone) { wrap.append(el('span', { class: 'bad', text: t('noPhone') })); return wrap; }
      if (!n) { wrap.append(el('span', { class: 'bad', text: t('badPhone') + ' · ' + c.phone })); return wrap; }
    } else {
      href = mailLink(c);
      num = c.email;
      if (!c.email) { wrap.append(el('span', { class: 'bad', text: t('noEmail') })); return wrap; }
    }
    wrap.append(el('span', { class: 'num', text: num }));
    wrap.append(el('a', { class: 'btn', href: href, target: '_blank', rel: 'noopener noreferrer', 'data-ch': ch, 'data-id': c.id, text: ch === 'wa' ? t('openWa') : t('openEm') }));
    var cb = el('input', { type: 'checkbox', id: 'cb-' + ch + '-' + c.id, 'data-ch': ch, 'data-id': c.id });
    cb.checked = !!done;
    wrap.append(el('label', { for: 'cb-' + ch + '-' + c.id }, cb, el('span', { text: t('done') })));
    return wrap;
  }
  function renderTable() {
    var area = $('listArea');
    area.textContent = '';
    if (!state.contacts.length) { area.append(el('div', { class: 'empty', text: t('empty') })); renderProgress(); return; }
    var head = el('tr', {}, el('th', { text: t('colName') }), el('th', { text: t('colLang') }), el('th', { text: t('colWa') }), el('th', { text: t('colEm') }), el('th', {}));
    var tbody = el('tbody');
    state.contacts.forEach(function (c) {
      var sel = el('select', { 'data-act': 'lang', 'data-id': c.id, 'aria-label': t('colLang') },
        el('option', { value: 'zh', text: '中文' }), el('option', { value: 'en', text: 'English' }));
      sel.value = c.lang;
      tbody.append(el('tr', {},
        el('td', { class: 'name' }, c.name || '—'),
        el('td', {}, sel),
        el('td', {}, chanCell(c, 'wa')),
        el('td', {}, chanCell(c, 'em')),
        el('td', {}, el('button', { class: 'ghost', type: 'button', 'data-act': 'rm', 'data-id': c.id, 'aria-label': t('remove'), title: t('remove'), text: '×' }))
      ));
    });
    area.append(el('div', { class: 'tablewrap' }, el('table', {}, el('thead', {}, head), tbody)));
    renderProgress();
  }
  function renderAll() { applyI18n(); renderTplFields(); renderWho(); renderPreview(); renderTable(); }

  /* ---------- helpers ---------- */
  var toastTimer;
  function toast(msg) {
    var tt = $('toast'); tt.textContent = msg; tt.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { tt.hidden = true; }, 1600);
  }
  function copyText(txt) {
    function fallback() {
      try {
        var ta = el('textarea', { style: 'position:fixed;opacity:0;top:0' }); ta.value = txt;
        document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(t('copied'));
      } catch (e) {}
    }
    try {
      navigator.clipboard.writeText(txt).then(function () { toast(t('copied')); }, fallback);
    } catch (e) { fallback(); }
  }
  var lastField = 'tplBody';
  function insertVar(v) {
    var f = $(lastField);
    var s = f.selectionStart == null ? f.value.length : f.selectionStart;
    var e = f.selectionEnd == null ? s : f.selectionEnd;
    f.value = f.value.slice(0, s) + v + f.value.slice(e);
    f.focus(); f.selectionStart = f.selectionEnd = s + v.length;
    f.dispatchEvent(new Event('input'));
  }

  /* ---------- events ---------- */
  function init() {
    load();
    var refreshLinks = debounce(function () { renderPreview(); renderTable(); }, 150);

    $('uiLang').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      state.ui = b.dataset.l; save(); renderAll();
    });
    $('tplTab').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      state.tplTab = b.dataset.l; save(); renderTplFields(); renderPreview();
    });
    $('tplSubject').addEventListener('input', function () { state.tpl[state.tplTab].subject = this.value; save(); refreshLinks(); });
    $('tplBody').addEventListener('input', function () { state.tpl[state.tplTab].body = this.value; save(); refreshLinks(); });
    $('tplSubject').addEventListener('focus', function () { lastField = 'tplSubject'; });
    $('tplBody').addEventListener('focus', function () { lastField = 'tplBody'; });
    $('insName').addEventListener('click', function () { insertVar('{name}'); });
    $('insSender').addEventListener('click', function () { insertVar('{sender}'); });
    $('sender').addEventListener('input', function () { state.sender = this.value; save(); refreshLinks(); });
    $('previewWho').addEventListener('change', function () { state.who = this.value; renderPreview(); });
    $('copyWa').addEventListener('click', function () { copyText(msgFor(state.tplTab, previewName()).body); });
    $('copyEm').addEventListener('click', function () {
      var m = msgFor(state.tplTab, previewName()); copyText(m.subject + '\n\n' + m.body);
    });

    $('cc').addEventListener('input', function () { state.cc = this.value.replace(/\D/g, ''); save(); refreshLinks(); });
    $('defLang').addEventListener('change', function () { state.defLang = this.value; save(); });
    $('provider').addEventListener('change', function () { state.provider = this.value; save(); renderTable(); });

    $('addBtn').addEventListener('click', function () {
      var v = $('paste').value;
      if (!v.trim()) return;
      addFromText(v); $('paste').value = '';
    });
    $('uploadBtn').addEventListener('click', function () { $('file').click(); });
    $('file').addEventListener('change', function () {
      var f = this.files && this.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { addFromText(String(r.result || '')); };
      r.readAsText(f);
      this.value = '';
    });
    $('clearBtn').addEventListener('click', function () {
      state.contacts = []; state.who = ''; $('addMsg').textContent = ''; save(); renderAll();
    });
    $('resetBtn').addEventListener('click', function () {
      state.contacts.forEach(function (c) { c.waDone = false; c.emDone = false; });
      save(); renderTable();
    });

    var list = $('listArea');
    list.addEventListener('click', function (ev) {
      var a = ev.target.closest('a[data-ch]');
      if (a) {
        var c = state.contacts.filter(function (x) { return x.id === a.dataset.id; })[0];
        if (c) {
          if (a.dataset.ch === 'wa') c.waDone = true; else c.emDone = true;
          save();
          setTimeout(renderTable, 60);
        }
        return;
      }
      var rm = ev.target.closest('button[data-act="rm"]');
      if (rm) {
        state.contacts = state.contacts.filter(function (x) { return x.id !== rm.dataset.id; });
        save(); renderWho(); renderPreview(); renderTable();
      }
    });
    list.addEventListener('change', function (ev) {
      var tg = ev.target;
      var c = state.contacts.filter(function (x) { return x.id === tg.dataset.id; })[0];
      if (!c) return;
      if (tg.dataset.act === 'lang') { c.lang = tg.value; save(); renderTable(); return; }
      if (tg.dataset.ch === 'wa') c.waDone = tg.checked;
      if (tg.dataset.ch === 'em') c.emDone = tg.checked;
      save(); renderTable();
    });

    renderAll();
  }
  init();
})();
</script>
</body>
</html>
